name: RealPact
description: >-
  RealPact is a Y Combinator (Summer 2026) startup building an AI-native
  operating system for real estate brokerages. Its voice-enabled AI agents
  automate the operational work behind every deal: the Deed Agent retrieves
  county deed records and flags encumbrances, the Tax & Vision Agent uses
  computer vision to extract tax assessments and property details, the Property
  Agent consolidates ownership and property information, and the Transaction
  Agent auto-fills contracts, manages disclosures, coordinates signatures, and
  tracks compliance deadlines. The company aims to compress transaction
  workflows from hours to minutes for brokerages, with early customers including
  Four Seasons Sotheby's International Realty and Black House Real Estate. Backed
  by Y Combinator and the LeapYear Fund, RealPact currently operates a
  customer-facing application and marketing site but publishes no public API,
  SDK, or developer program as of this profiling.
